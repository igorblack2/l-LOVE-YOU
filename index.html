<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Laura ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050505;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
            perspective: 1000px;
        }

        /* --- FUNDO DE CORAÇÕES --- */
        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            color: rgba(255, 51, 102, 0.3);
            font-size: 20px;
            animation: float 6s linear infinite;
            opacity: 0;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            text-shadow: 0 0 10px #ff3366;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: 10px;
        }

        .btn-principal {
            background: #ff3366;
            color: white;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
        }

        #btn-sim { 
            background: #2ecc71; 
            color: white; 
            z-index: 5;
        }
        
        .btn-nao { 
            background: #e74c3c; 
            color: white; 
            position: absolute; 
            z-index: 10;
        }

        .hidden { display: none !important; }

        /* --- CORAÇÃO E NOME --- */
        #heart-container {
            position: absolute;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .love-text {
            position: absolute;
            font-size: clamp(8px, 2vw, 12px);
            font-weight: bold;
            color: #ff3366;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 0 0 8px #ff3366;
            animation: pulse-light 2s infinite ease-in-out;
        }

        #nome-central {
            position: absolute;
            font-size: clamp(1.5rem, 6vw, 2.8rem);
            font-weight: 900;
            color: white;
            text-shadow: 0 0 20px #ff3366, 0 0 40px #ff3366;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 100;
            width: 300px;
            text-align: center;
        }

        @keyframes pulse-light {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="bg-hearts" id="bg-hearts"></div>

    <div id="passo1" class="container">
        <button class="btn-principal" onclick="irParaPasso2()">Seja bem vinda minha querida !</button>
    </div>

    <div id="passo2" class="container hidden">
        <h1 id="pergunta">Você me ama?</h1>
        <div style="height: 150px; position: relative; display: flex; justify-content: center; align-items: center;">
            <button id="btn-sim" onclick="irParaPasso3()">Sim</button>
            <button id="btn-nao" class="btn-nao">Não</button>
        </div>
    </div>

    <div id="passo3" class="container hidden">
        <button class="btn-principal" onclick="iniciarCoracao()">Mesmo? ❤️</button>
    </div>

    <div id="heart-container"></div>

    <script>
        const btnNao = document.getElementById('btn-nao');
        const btnSim = document.getElementById('btn-sim');
        const heartContainer = document.getElementById('heart-container');
        const bgHearts = document.getElementById('bg-hearts');
        
        let naoCount = 0;
        const frasesNao = [
            "Não", "Tem certeza?", "Pensa bem...", 
            "Coração de gelo!", "Vou chorar...", 
            "Errado! Tente de novo", "Aceito apenas SIM",
            "Laura, por favor!", "Ainda tentando?"
        ];

        // Criar corações flutuantes no fundo
        function createBackgroundHearts() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            bgHearts.appendChild(heart);
            
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createBackgroundHearts, 300);

        function irParaPasso2() {
            document.getElementById('passo1').classList.add('hidden');
            document.getElementById('passo2').classList.remove('hidden');
        }

        function irParaPasso3() {
            document.getElementById('passo2').classList.add('hidden');
            document.getElementById('passo3').classList.remove('hidden');
        }

        function handleNao() {
            const x = Math.random() * (window.innerWidth - btnNao.offsetWidth);
            const y = Math.random() * (window.innerHeight - btnNao.offsetHeight);
            btnNao.style.position = 'fixed';
            btnNao.style.left = x + 'px';
            btnNao.style.top = y + 'px';

            naoCount++;
            btnNao.innerText = frasesNao[naoCount % frasesNao.length];

            const novoTamanho = 1 + (naoCount * 0.2);
            btnSim.style.transform = `scale(${novoTamanho})`;
            
            if(naoCount > 5) {
                 document.getElementById('pergunta').innerText = "O 'Sim' está ficando irresistível, né?";
            }
        }

        btnNao.addEventListener('mouseover', handleNao);
        btnNao.addEventListener('touchstart', (e) => { e.preventDefault(); handleNao(); });
        btnNao.addEventListener('click', () => alert("Erro técnico: Opção inválida! Tente o botão verde."));

        function iniciarCoracao() {
            document.getElementById('passo3').classList.add('hidden');
            const nomeElement = document.createElement('div');
            nomeElement.id = 'nome-central';
            nomeElement.innerText = 'Meu anjo Laura';
            heartContainer.appendChild(nomeElement);

            const isMobile = window.innerWidth < 768;
            const total = isMobile ? 130 : 250;
            const scale = isMobile ? 12 : 18;

            for (let i = 0; i < total; i++) {
                const span = document.createElement('span');
                span.className = 'love-text';
                span.innerText = 'I LOVE YOU';
                const t = (i / total) * 2 * Math.PI;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                span.style.left = (x * scale) + 'px';
                span.style.top = (y * scale) + 'px';
                span.style.animationDelay = (Math.random() * 2) + 's';
                heartContainer.appendChild(span);
            }

            let angle = 0;
            function animate() {
                angle += 0.5;
                heartContainer.style.transform = `rotateY(${angle}deg) rotateX(${Math.sin(angle/50)*10}deg)`;
                nomeElement.style.transform = `rotateY(${-angle}deg)`;
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
